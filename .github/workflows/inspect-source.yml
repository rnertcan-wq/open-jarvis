name: Inspect JARVIS source archive

on:
  push:
    branches: [jarvis-ai-apk]
    paths:
      - '.github/workflows/inspect-source.yml'
      - 'jarvis-ai-source/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        shell: bash
        run: |
          cat jarvis-ai-source/part1.b64 jarvis-ai-source/part2.b64 jarvis-ai-source/part3.b64 jarvis-ai-source/part4.b64 jarvis-ai-source/part4b.b64 jarvis-ai-source/part5.b64 | base64 -d > /tmp/source.tar.gz
          mkdir extracted
          tar -xzf /tmp/source.tar.gz -C extracted
      - name: Create source inventory
        run: |
          find extracted -type f | sort > source-files.txt
          grep -RInE 'API.?key|provider|conversation|history|attachment|image_picker|file_picker|plus' extracted --include='*.dart' > source-hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-source-inspection
          path: |
            source-files.txt
            source-hits.txt
            extracted/jarvis_ai/lib/**
          retention-days: 3
