name: Build M.G Wp Avci APK

on:
  push:
    branches:
      - firsat-avcisi
    paths:
      - 'android/**'
      - '.github/workflows/build-mg-wp-avci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-wp-avci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "MG-Wp-Avci-1.2.0-debug.apk"
          ls -lh "MG-Wp-Avci-1.2.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-Wp-Avci-1.2.0-debug-apk
          path: android/MG-Wp-Avci-1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
