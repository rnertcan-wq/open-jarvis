name: JARVIS AI Android APK

on:
  push:
    branches:
      - jarvis-ai-apk
    paths:
      - 'jarvis-ai-source/**'
      - 'jarvis-patches/**'
      - '.github/workflows/jarvis-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned stable toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Install Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Restore JARVIS AI source archive
        shell: bash
        run: |
          cat jarvis-ai-source/part1.b64 \
              jarvis-ai-source/part2.b64 \
              jarvis-ai-source/part3.b64 \
              jarvis-ai-source/part4.b64 \
              jarvis-ai-source/part4b.b64 \
              jarvis-ai-source/part5.b64 > /tmp/jarvis-ai-source.b64
          base64 --decode /tmp/jarvis-ai-source.b64 > /tmp/jarvis-ai-source.tar.gz
          tar -tzf /tmp/jarvis-ai-source.tar.gz >/dev/null
          mkdir -p build-source
          tar -xzf /tmp/jarvis-ai-source.tar.gz -C build-source

      - name: Apply JARVIS 0.2.0 feature patch
        shell: bash
        run: |
          cp -R jarvis-patches/lib/. build-source/jarvis_ai/app/lib/
          cp jarvis-patches/pubspec.yaml build-source/jarvis_ai/app/pubspec.yaml

      - name: Resolve Flutter dependencies and build APK
        working-directory: build-source/jarvis_ai
        run: |
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Align and sign release APK
        shell: bash
        working-directory: build-source/jarvis_ai
        run: |
          set -euo pipefail
          APK_DIR="app/build/app/outputs/flutter-apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/jarvis-ai-release.jks" \
            -storepass jarvis-temp-store-pass \
            -keypass jarvis-temp-store-pass \
            -alias jarvis-ai \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=JARVIS AI, OU=Mobile, O=JARVIS AI, C=TR"
          "$BUILD_TOOLS/zipalign" -f 4 \
            "$APK_DIR/app-release.apk" "$RUNNER_TEMP/app-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/jarvis-ai-release.jks" \
            --ks-key-alias jarvis-ai \
            --ks-pass pass:jarvis-temp-store-pass \
            --key-pass pass:jarvis-temp-store-pass \
            --out "$APK_DIR/JARVIS-AI-0.2.0-signed.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose \
            "$APK_DIR/JARVIS-AI-0.2.0-signed.apk"

      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-android-apk-signed
          path: build-source/jarvis_ai/app/build/app/outputs/flutter-apk/JARVIS-AI-0.2.0-signed.apk
          if-no-files-found: error
          retention-days: 14
