name: JARVIS AI Android APK

on:
  push:
    branches:
      - jarvis-ai-apk
    paths:
      - 'jarvis-ai-source/**'
      - '.github/workflows/jarvis-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore JARVIS AI source archive
        shell: bash
        run: |
          cat jarvis-ai-source/part1.b64 \
              jarvis-ai-source/part2.b64 \
              jarvis-ai-source/part3.b64 \
              jarvis-ai-source/part4.b64 \
              jarvis-ai-source/part4b.b64 \
              jarvis-ai-source/part5.b64 > /tmp/jarvis-ai-source.b64
          base64 --decode /tmp/jarvis-ai-source.b64 > /tmp/jarvis-ai-source.tar.gz
          tar -tzf /tmp/jarvis-ai-source.tar.gz >/dev/null
          mkdir -p build-source
          tar -xzf /tmp/jarvis-ai-source.tar.gz -C build-source

      - name: Resolve Flutter dependencies and build APK
        working-directory: build-source/jarvis_ai
        run: |
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-android-apk
          path: build-source/jarvis_ai/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
