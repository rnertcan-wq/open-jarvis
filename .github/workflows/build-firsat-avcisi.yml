name: Build Fırsat Avcısı APK

on:
  push:
    branches:
      - firsat-avcisi
    paths:
      - 'FirsatAvcisi-source.tar.xz'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: tar -xJf FirsatAvcisi-source.tar.xz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: FirsatAvcisi
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FirsatAvcisi-debug-apk
          path: FirsatAvcisi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
